# Sky v1 of the Tycho survey: sharper known-answer tasks, chosen from what sky v0 taught (docs/results/v0_findings.md).
# Format: see configs/sky_v0.yaml and tycho/survey/sky.py. Pass/fail criteria, fixed before the run:
# docs/results/v1_preregistration.md. Every RI curve of a binary-input task also stores the Walsh-Fourier baseline
# of the same subsets at the same checkpoints, so RI and Fourier can be compared run by run.
version: sky-v1
description: >
  Sharper known-answer tasks. Sparse parity at n = 16 to 64 and k = 2 to 4 with 10 seeds, to fit how the onset of the
  planted interaction scales with n for each order. Markov language with planted orders 2 to 5 at two strengths,
  higher-order terms alone and with lower-order terms, each trained on chain contexts and on independent contexts
  (removes the v0 confound). Grokking on modular addition at 50k steps with RI follow-ups that take every outcome at
  the same configuration (grokking, memorization, smooth) as matched controls.
regions:
  # ---------------------------------------------------------------- sparse parity: onset vs n, per order
  # Online data (fresh batches), the best v0 learning rate and a slower one (robustness of the exponent).
  # v0 medians of steps to 90 % test accuracy at width 512, lr 0.1: k=2: 56 / 112 / 133 (n = 16 / 24 / 32);
  # k=3: 642 / 911 / 1,832. Budgets leave at least 10x headroom at the largest n; k = 4 stops at n = 32, where
  # SGD needs of order n^3 samples.
  - name: parity-k2
    task: sparse_parity
    seeds: 10
    priority: 1.0
    ri_policy: always
    ri: {n_probe: 4096, n_points: 60}
    fixed: {k: 2, width: 512, depth: 1, act: relu, test_size: 2048}
    train: {steps: 20000, batch_size: 32, optimizer: sgd, momentum: 0.0, n_log_evals: 80, n_lin_evals: 0}
    knobs:
      n: {values: [16, 24, 32, 48, 64], kind: ordinal}
      train.lr: {values: [0.03, 0.1], kind: log}
  - name: parity-k3
    task: sparse_parity
    seeds: 10
    priority: 1.5
    ri_policy: always
    ri: {n_probe: 4096, n_points: 60}
    fixed: {k: 3, width: 512, depth: 1, act: relu, test_size: 2048}
    train: {steps: 60000, batch_size: 32, optimizer: sgd, momentum: 0.0, n_log_evals: 80, n_lin_evals: 0}
    knobs:
      n: {values: [16, 24, 32, 48, 64], kind: ordinal}
      train.lr: {values: [0.03, 0.1], kind: log}
  - name: parity-k4
    task: sparse_parity
    seeds: 10
    priority: 2.0
    ri_policy: always
    ri: {n_probe: 4096, n_points: 60}
    fixed: {k: 4, width: 512, depth: 1, act: relu, test_size: 2048}
    train: {steps: 150000, batch_size: 32, optimizer: sgd, momentum: 0.0, n_log_evals: 80, n_lin_evals: 0}
    knobs:
      n: {values: [16, 24, 32], kind: ordinal}
      train.lr: {values: [0.03, 0.1], kind: log}
  # ---------------------------------------------------------------- Markov language: order, strength, context
  # Couplings "lags:beta;...": a coupling with L lags is an interaction of order L + 1 with the next token.
  # Rows 1-8: one planted interaction of each order 2-5 at two strengths. Rows 9-12: a higher-order term alone and
  # with a pairwise term (the v0 comparison, plus {1,2,3} alone, which v0 lacked). train_context "iid" trains on
  # independent uniform windows with the same conditional, removing the context correlation that confounded v0.
  # RI probes are uniform windows in both cases, so onsets measure what the model learned, not the source.
  - name: markov-v1
    task: markov_lang
    seeds: 10
    priority: 1.5
    ri_policy: always
    ri: {n_probe: 8192, n_points: 60}
    fixed: {window: 6, width: 128, depth: 1, n_tokens: 200000}
    train: {steps: 30000, batch_size: 64, optimizer: adam, lr: 0.001, n_log_evals: 80, n_lin_evals: 0}
    knobs:
      couplings:
        kind: categorical
        values: ["1:1.0", "1,3:1.0", "1,2,4:1.0", "1,2,3,5:1.0",
                 "1:0.5", "1,3:0.5", "1,2,4:0.5", "1,2,3,5:0.5",
                 "1,3:0.8", "1:1.0;1,3:0.8", "1,2,3:1.0", "1:1.0;1,2,3:1.0"]
      train_context: {values: [chain, iid], kind: categorical}
  # ---------------------------------------------------------------- grokking with matched controls
  # 50k steps (v0's grokking delays piled up at 15-19k of 20k). RI only by follow-up replay; the scheduler's
  # matched stream follows up every outcome at configurations whose seeds disagree. Hidden ReLU units are binarised
  # (active or not); min_effect 0.005 nats is twice the largest higher-order binarisation artefact of calibration E6
  # (0.0025 at order 4, correlation 0.9) and well above the noise floor at the 2,209 probe rows (all p^2 pairs).
  - name: grokking-v1
    task: modular_addition
    seeds: 5
    priority: 2.0
    ri_policy: followup
    ri: {min_effect: 0.005, n_points: 60}
    fixed: {p: 47, depth: 1, embed: onehot, ri_units: 10}
    train: {steps: 50000, batch_size: 512, optimizer: adamw, beta2: 0.98, n_log_evals: 100}
    knobs:
      train_frac: {values: [0.3, 0.4, 0.5], kind: linear, refine: true}
      width: {values: [64, 256], kind: log}
      train.lr: {values: [0.001, 0.003], kind: log}
      train.weight_decay: {values: [0.1, 0.3, 1.0], kind: log, refine: true}
